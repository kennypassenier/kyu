# Deployment unit (C1, K13): one service, one volume, one port. On the
# LXC this pulls the published image; `docker compose build` uses the
# local Dockerfile instead.
services:
  kyu:
    image: ghcr.io/kennypassenier/kyu:latest
    build: .
    container_name: kyu
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # A named volume, deliberately, and the reason is worth knowing before
      # you "fix" it: the image is distroless and runs as uid 65532, and the
      # Dockerfile hands /data to that user. A named volume inherits that
      # ownership; a bind mount does not, so `- ./data:/data` makes the hub
      # refuse to start until you chown the directory yourself. Tried and
      # measured on 2026-08-28, not assumed.
      #
      # The cost, and it is real: the homelab's nightly restic backup walks
      # host directories, so a named volume is invisible to it. Deploying
      # THROUGH the homelab therefore uses its own preset
      # (presets/kyu/), whose compose binds /appdata/<stack>/
      # kyu-config and carries the backup labels. This file is the
      # standalone route; back it up with POST /api/backup (W8) or a host
      # snapshot of the volume.
      - kyu-data:/data
    environment:
      KYU_LISTEN: 0.0.0.0:8080
      KYU_STATE_DIR: /data            # 3.0.0: was KYU_DATA_DIR (still honoured, with a warning)
      KYU_LOG: info
      # KYU_LOG_FORMAT: json          # one JSON object per line, for Loki
      #
      # --- The door (W2) -------------------------------------------------
      # Leave both unset and the hub runs with no door at all: anyone who can
      # reach it can read every message and publish. That is a real choice for
      # a hub nothing else can reach, and the hub says so loudly on every
      # startup and on every dashboard page, so it can never be a surprise.
      #
      # Set them and you get a login page, per-app tokens, and an
      # Authorization header on every command the dashboard prints. BOTH are
      # required together — one without the other refuses to start:
      #
      #   KYU_TOKEN: <what you log in with>        openssl rand -hex 24
      #   KYU_SECRET_KEY: <64 hex characters>      openssl rand -hex 32
      #
      # They do different jobs, and the difference matters exactly once:
      # KYU_TOKEN is the password you type; KYU_SECRET_KEY encrypts
      # the per-app tokens in the store. Rotating the token is therefore safe
      # and rotating the key is not — change the key and every app token
      # becomes unreadable, and you re-issue them on the apps page. Keep both
      # here, and keep a copy somewhere you will find it again.
      #
      # Hub-wide defaults. Every one of these can be overridden per topic or
      # per subscription through the API, so these are the starting point
      # rather than the rule:
      #   KYU_RETENTION_MS      604800000 (7d), or "never" to keep forever
      #   KYU_IDLE_FLAG_MS      604800000 (7d) before a quiet subscription is flagged
      #   KYU_IDLE_ARCHIVE_MS  2592000000 (30d) before it is archived
      # A consumer with a slower rhythm sets its own idle_flag_ms and
      # idle_archive_ms in its subscription policy — see the README.
    # The healthcheck is defined in the Dockerfile and inherited here:
    # the binary probes itself, because this image has no shell to run
    # curl from (W6, T9).

volumes:
  kyu-data:
