# Dependency policy for T6 ("reluctant, policed"). Checked in CI on
# every push and again weekly (advisories move without our code moving).

[advisories]
yanked = "deny"

[licenses]
# kyu itself is MIT OR Apache-2.0 (T7); dependencies must be
# permissive. A copyleft dependency is a decision, not an accident:
# adding one requires editing this list in a reviewed commit.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions of one crate mean two copies compiled in; at this
# project's dependency count that is a smell worth seeing.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
