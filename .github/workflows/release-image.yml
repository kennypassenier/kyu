# K13 · every version tag publishes a Docker image to GHCR, so the homelab
# deploys and updates mailbox like any other app. Taken verbatim (bar this
# comment) from ~/Projects/homelab/templates/rust-service/release-image.yml,
# which exists so every one of Kenny's Rust repos ships the same way — one
# shape to remember rather than four.
#
# Tag to release:  git tag v0.1.0 && git push origin v0.1.0
#
# UNVERIFIED, carried over from the homelab guide: it claims the GHCR package
# is created PRIVATE even on a public repo, and must be flipped to public once
# (repo -> Packages -> package settings -> Change visibility) before the
# homelab host can pull it anonymously. Nobody has confirmed this against a
# real package yet. If the first tag produces a public package, this note and
# the one in the homelab guide should both go.
name: release-image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
