# The homelab's stack file for a native service (AR18; `homelab adopt`).
# kyu is the native hub of the `kyu` stack on CT 109 (hostname 109-app-kyu);
# the authoritative copy lives in the homelab repo at stacks/kyu/service.yml —
# this is what 3.0.0 asks that copy to become. update_cmd reproduces the unit
# line for line — same user, working directory and EnvironmentFile — and waits
# for the result, so "already current" is exit 0 without a restart and a
# failure carries its stderr. Self-update stays supervised: the homelab owns
# the nightly, the hub only installs what it is asked to.
stack_name: kyu
vmid: 109
hostname: 109-app-kyu
unit: kyu
binary: /opt/kyu/bin/kyu
env_file: /appdata/kyu/kyu-config/kyu.env
data_dirs:
  - /appdata/kyu/kyu-config
update_cmd: >-
  systemd-run --wait --pipe --collect --uid=kyu --gid=kyu
  --property=EnvironmentFile=/appdata/kyu/kyu-config/kyu.env
  --property=WorkingDirectory=/appdata/kyu/kyu-config
  /opt/kyu/bin/kyu update
release_repo: kennypassenier/kyu
release_asset: kyu
