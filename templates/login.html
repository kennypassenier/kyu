<!doctype html>
<html lang="en" data-bs-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mailbox — log in</title>
<link rel="stylesheet" href="/static/bootstrap.min.css">
</head>
<body class="d-flex align-items-center" style="min-height: 100vh">
<main class="container" style="max-width: 26rem">
  <h1 class="h4 mb-1">mailbox</h1>
  <p class="text-secondary mb-4">This hub is protected. Paste a token to continue.</p>

  {% if error %}
  <div class="alert alert-danger" role="alert">{{ error }}</div>
  {% endif %}

  <form method="post" action="/login">
    <div class="mb-3">
      <label for="token" class="form-label">Token</label>
      <input type="password" class="form-control font-monospace" id="token" name="token"
             autocomplete="current-password" autofocus required>
      <div class="form-text">
        The value of <code>MAILBOX_TOKEN</code> from your compose file, or any
        token from the apps page.
      </div>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="remember" name="remember" value="1" checked>
      <label class="form-check-label" for="remember">Stay logged in on this device</label>
    </div>
    <button type="submit" class="btn btn-primary w-100">Log in</button>
  </form>
</main>
</body>
</html>
