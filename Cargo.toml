[package]
name = "kyu"
version = "3.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "A self-documenting durable message hub for a homelab"
repository = "https://github.com/kennypassenier/kyu"
publish = false

# Dependency policy T6 ("reluctant, policed"): each direct dependency is
# justified in the commit that adds it, and cargo-deny checks advisories,
# licenses and duplicates in CI.
[dependencies]
anyhow = "1"                                                    # error context at the binary edge (AR4)
axum = "0.8"                                                    # HTTP surface (T1)
chassis = { git = "https://github.com/kennypassenier/chassis-rs", tag = "v1.2.0", default-features = false, features = ["core", "self-update", "assets"] } # the shared service kit (3.0.0)
base64 = "0.23.1"
chacha20poly1305 = "0.10"                                       # app-token encryption at rest (W2, AR11 amendment)
minijinja = "2.24.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }  # runtime (T3)
tracing = "0.1"                                                 # structured events (T5)
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ulid = "3.0.0"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false }        # real HTTP in tests (SR9); no TLS needed for localhost
tempfile = "3.27.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
