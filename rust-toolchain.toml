# The one Rust this project builds with, here and in CI (standing rule 7):
# a gate that does not predict the build is not a gate. Raising it is a
# deliberate act: bump the channel here and `rust-version` in Cargo.toml
# together, run the gates, fix what the newer clippy has learned.
[toolchain]
channel = "1.97"
components = ["rustfmt", "clippy"]
# musl (G1, 2026-09-09): the release binary is static, so this target must
# be installed wherever the pin resolves — including inside the release
# Dockerfile's build stage, which is exactly where `rustup target add` run
# before this file existed stopped taking effect once rustup re-resolved
# against the pin.
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
