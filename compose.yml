# Deployment unit (C1, K13): one service, one volume, one port. On the
# LXC this pulls the published image; `docker compose build` uses the
# local Dockerfile instead.
services:
  mailbox:
    image: ghcr.io/kennypassenier/mailbox:latest
    build: .
    container_name: mailbox
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - mailbox-data:/data
    environment:
      MAILBOX_LISTEN: 0.0.0.0:8080
      MAILBOX_DATA_DIR: /data
      MAILBOX_LOG: info
      # MAILBOX_LOG_FORMAT: json          # one JSON object per line, for Loki
      #
      # --- The door (W2) -------------------------------------------------
      # Leave both unset and the hub runs with no door at all: anyone who can
      # reach it can read every message and publish. That is a real choice for
      # a hub nothing else can reach, and the hub says so loudly on every
      # startup and on every dashboard page, so it can never be a surprise.
      #
      # Set them and you get a login page, per-app tokens, and an
      # Authorization header on every command the dashboard prints. BOTH are
      # required together — one without the other refuses to start:
      #
      #   MAILBOX_TOKEN: <what you log in with>        openssl rand -hex 24
      #   MAILBOX_SECRET_KEY: <64 hex characters>      openssl rand -hex 32
      #
      # They do different jobs, and the difference matters exactly once:
      # MAILBOX_TOKEN is the password you type; MAILBOX_SECRET_KEY encrypts
      # the per-app tokens in the store. Rotating the token is therefore safe
      # and rotating the key is not — change the key and every app token
      # becomes unreadable, and you re-issue them on the apps page. Keep both
      # here, and keep a copy somewhere you will find it again.
      #
      # Hub-wide defaults. Every one of these can be overridden per topic or
      # per subscription through the API, so these are the starting point
      # rather than the rule:
      #   MAILBOX_RETENTION_MS      604800000 (7d), or "never" to keep forever
      #   MAILBOX_IDLE_FLAG_MS      604800000 (7d) before a quiet subscription is flagged
      #   MAILBOX_IDLE_ARCHIVE_MS  2592000000 (30d) before it is archived
      # A consumer with a slower rhythm sets its own idle_flag_ms and
      # idle_archive_ms in its subscription policy — see the README.
    # The healthcheck is defined in the Dockerfile and inherited here:
    # the binary probes itself, because this image has no shell to run
    # curl from (W6, T9).

volumes:
  mailbox-data:
