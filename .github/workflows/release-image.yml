# K13 · every version tag publishes a Docker image to GHCR, so the homelab
# deploys and updates kyu like any other app. Taken verbatim (bar this
# comment) from ~/Projects/homelab/templates/rust-service/release-image.yml,
# which exists so every one of Kenny's Rust repos ships the same way — one
# shape to remember rather than four.
#
# Tag to release:  git tag v0.1.0 && git push origin v0.1.0
#
# On package visibility: a package published this way is linked to the
# repository and takes its visibility, so a public repo yields a package the
# homelab host can pull anonymously. An earlier version of this comment
# repeated a claim from the homelab guide that the package is created PRIVATE
# and must be flipped by hand; Kenny checked and that is wrong, so it is gone
# rather than left to send someone hunting for a setting.
#
# If the host ever cannot pull it: repo -> Packages -> package settings is
# where visibility lives.
name: release-image

on:
  push:
    tags: ["v*"]

permissions:
  # write, not read: the same job attaches the binary and its checksums to
  # the release (F168), so the homelab can install a verified native build
  # instead of someone copying a file by hand.
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # F168 · the release carries the binary too, so `homelab install-native`
      # can fetch it, verify it against SHA256SUMS on Kenny's desktop, and
      # only then push the bytes into the container. Without this, updating
      # the native deployment on CT 109 is a manual copy.
      #
      # Deliberately EXTRACTED from the image rather than built again: cargo
      # compiles exactly once, so the binary published here is byte-for-byte
      # the one running in the container. A second `cargo build` in this
      # workflow would be a second build path, and two build paths drift.
      - name: Extract the binary from the image just built
        run: |
          set -euo pipefail
          ref="ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}"
          docker pull "$ref"
          id=$(docker create "$ref")
          docker cp "$id:/usr/local/bin/kyu" ./kyu
          docker rm "$id"
          chmod 755 ./kyu
          # Plain sha256sum format, one line per file: <64 hex>  <name>.
          sha256sum kyu > SHA256SUMS
          cat SHA256SUMS
          # A published binary that cannot run is worse than none at all.
          ./kyu --version

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            kyu
            SHA256SUMS
