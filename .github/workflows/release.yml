name: Release

# On a `v*` tag: build a static musl binary (G1, 2026-09-09 — see below),
# write SHA256SUMS, push the container image to GHCR, and create the
# GitHub release with the binary and the manifest. Everything here runs
# with the workflow's own GITHUB_TOKEN — no personal token anywhere.
#
# G1: the binary used to link against the build image's own glibc ("the
# same Debian the services run on" — a promise this repo never checked
# against reality). kyu 3.1.0's attempted deploy to CT 109 (Debian 12,
# glibc 2.36) failed outright: the release was built against Debian
# trixie's glibc 2.39, which CT 109 does not have. musl removes the
# dependency entirely — the binary carries its own libc and runs on any
# Linux kernel, matching or not. `dist/kyu`'s own build below verifies
# this with `ldd` before it is ever uploaded.
#
# The signature (`SHA256SUMS.minisig`) and `VERSION` are NOT made here: the
# signing key stays on Kenny's machine, and `chassis release <version>`
# uploads both once this run is green (J2). The self-updater refuses a
# release until all four assets exist, so an unsigned release is inert.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: build · checksum · image · release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Version from the tag must match Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$tag" != "$cargo_version" ]; then
            echo "tag v$tag but Cargo.toml says $cargo_version. What now: bump Cargo.toml (chassis release does this) and re-tag."; exit 1
          fi
      - name: Build the static release binary (musl, glibc-independent)
        # No explicit `rustup target add`: rust-toolchain.toml's own
        # `targets` list installs it the moment rustup resolves the pin
        # against the mounted repo — adding it by hand here, before that
        # file is in view, silently lands on a different toolchain
        # resolution than the one cargo build then uses (found the hard
        # way: identical symptom in the Dockerfile, see its own comment).
        run: |
          docker run --rm -v "$PWD":/w -w /w -e CARGO_TARGET_DIR=/w/target-musl -e CARGO_HOME=/w/target-musl/cargo-home rust:1.97-slim-trixie \
            sh -c 'apt-get update -qq >/dev/null && apt-get install -y -qq musl-tools >/dev/null && CC_x86_64_unknown_linux_musl=musl-gcc cargo build --release --locked --target x86_64-unknown-linux-musl'
          mkdir -p dist
          cp target-musl/x86_64-unknown-linux-musl/release/kyu dist/kyu
          (cd dist && sha256sum kyu > SHA256SUMS && cat SHA256SUMS)
      - name: The binary must not depend on the build image's own glibc (G1)
        run: |
          # A dynamically linked binary's ldd output lists each shared
          # library with "=>"; a static one prints one line with neither
          # (glibc's ldd says "statically linked" for a static-pie binary,
          # "not a dynamic executable" for a plain static one — the "=>"
          # absence is what actually matters, not the exact wording).
          if ldd dist/kyu 2>&1 | grep -q '=>'; then
            echo "dist/kyu is dynamically linked. What now: the musl build step above did not produce a static binary — check CC_x86_64_unknown_linux_musl and the --target flag."; exit 1
          fi
          file dist/kyu
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kennypassenier/kyu:${{ github.ref_name }}
            ghcr.io/kennypassenier/kyu:latest
      - name: Create the GitHub release with binary + SHA256SUMS
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/kyu
            dist/SHA256SUMS
          body: |
            Built from `${{ github.sha }}`. The signature (`SHA256SUMS.minisig`) and `VERSION`
            are added by `chassis release`; until they are, the self-updater ignores this release.
