# K13 · every version tag publishes a Docker image to GHCR, so the homelab
# deploys and updates kyu like any other app. Taken verbatim (bar this
# comment) from ~/Projects/homelab/templates/rust-service/release-image.yml,
# which exists so every one of Kenny's Rust repos ships the same way — one
# shape to remember rather than four.
#
# Tag to release:  git tag v0.1.0 && git push origin v0.1.0
#
# On package visibility: a package published this way is linked to the
# repository and takes its visibility, so a public repo yields a package the
# homelab host can pull anonymously. An earlier version of this comment
# repeated a claim from the homelab guide that the package is created PRIVATE
# and must be flipped by hand; Kenny checked and that is wrong, so it is gone
# rather than left to send someone hunting for a setting.
#
# If the host ever cannot pull it: repo -> Packages -> package settings is
# where visibility lives.
name: release-image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
