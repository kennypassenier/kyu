<!doctype html>
<html lang="en" data-theme="formal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kyu — log in</title>
<!-- Same no-flash script as layout.html (the kit's theme-boot.js): a login
     page is still a page, and until 2.4.0 this one was the one place on kyu
     that never picked up the visitor's stored theme at all. -->
<script src="/static/theme-boot.js?v={{ assets }}"></script>

<link rel="stylesheet" href="/static/fonts.css?v={{ assets }}">
<link rel="stylesheet" href="/static/themes.css?v={{ assets }}">
<link rel="stylesheet" href="/static/components.css?v={{ assets }}">
<link rel="stylesheet" href="/static/kyu.css?v={{ assets }}">
</head>
<body style="display: flex; align-items: center; min-height: 100vh">
<main style="max-width: 26rem; margin: 0 auto; padding: 1.5rem">
  <h1 style="margin-bottom: 0.25rem; font-size: 1.5rem">kyu</h1>
  <p class="text-secondary" style="margin-bottom: 1.5rem">This hub is protected. Paste a token to continue.</p>

  {% if error %}
  <div class="kp-alert kp-alert--destructive" role="alert" style="margin-bottom: 1rem">{{ error }}</div>
  {% endif %}

  <form method="post" action="/login" style="display: flex; flex-direction: column; gap: 1rem">
    <div class="kp-field" style="max-width: none">
      <label class="kp-field__label" for="token">Token</label>
      <input type="password" class="kp-field__input" id="token" name="token"
             style="font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace)"
             autocomplete="current-password" autofocus required>
      <p class="kp-field__help">
        The value of <code>KYU_TOKEN</code> from your compose file, or any
        token from the apps page.
      </p>
    </div>
    <div class="kp-field kp-field--check" style="max-width: none">
      <input class="kp-field__check" type="checkbox" id="remember" name="remember" value="1" checked>
      <label class="kp-field__label" for="remember">Stay logged in on this device</label>
    </div>
    <button type="submit" class="kp-button kp-button--primary" style="width: 100%">Log in</button>
  </form>
</main>
</body>
</html>
